<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>折線圖大冒險｜六年級數學互動課件</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
  background:linear-gradient(160deg,#E8F4FF 0%,#FFF0F4 55%,#FFF8E8 100%);
  min-height:100vh;color:#3D3A50;padding:24px 16px 48px;
}
.wrap{max-width:760px;margin:0 auto}
header{text-align:center;margin-bottom:20px;position:relative}
h1{font-size:26px;font-weight:700;letter-spacing:1px}
h1 .hl{color:#E86A92}
header p{color:#8A87A0;font-size:14px;margin-top:6px}
.mascot{display:inline-block;vertical-align:middle;margin-right:10px}
.floaty{position:fixed;border-radius:50%;opacity:.35;pointer-events:none;animation:float 6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.tabs{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:16px}
.tab{border:none;border-radius:999px;padding:10px 18px;font-size:15px;font-weight:600;cursor:pointer;background:#fff;color:#8A87A0;box-shadow:0 2px 8px rgba(61,58,80,.08);transition:all .2s ease;display:flex;align-items:center;gap:8px}
.tab .dot{width:10px;height:10px;border-radius:50%}
.tab.on{transform:translateY(-2px);box-shadow:0 6px 16px rgba(61,58,80,.16);color:#3D3A50}
.tab.done::after{content:"✓";color:#58B368;font-weight:700}
.card{background:#fff;border-radius:20px;box-shadow:0 8px 28px rgba(61,58,80,.10);padding:24px;animation:pop .3s ease}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.stephead{display:flex;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.stephead h3{font-size:20px}
.stephead p{font-size:14px;color:#8A87A0;margin-top:4px;line-height:22px}
.msg{border-radius:14px;padding:12px 16px;font-size:15px;line-height:24px;margin-top:14px;min-height:26px;transition:background .2s}
.msg.ok{background:#E9F9EF;color:#2F8F4E}
.msg.no{background:#FDECEF;color:#C0475F}
.msg.info{background:#F4F2FB;color:#6B6890}
.btn{border:none;border-radius:12px;padding:10px 22px;font-size:15px;font-weight:600;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease}
.btn:hover{transform:translateY(-2px)}
.btn-p{background:#3D3A50;color:#fff;box-shadow:0 4px 12px rgba(61,58,80,.25)}
.btn-g{background:#F4F2FB;color:#3D3A50}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
.opt{display:block;width:100%;text-align:left;border:2px solid #ECE9F5;background:#fff;border-radius:14px;padding:12px 16px;font-size:15px;margin-top:10px;cursor:pointer;color:#3D3A50;transition:all .15s ease}
.opt:hover{border-color:#9B7EDE;transform:translateX(3px)}
.opt.right{border-color:#58B368;background:#E9F9EF}
.opt.wrong{border-color:#E86A92;background:#FDECEF}
.hot{cursor:pointer}
.hot circle.pulse{animation:pl 1.6s infinite}
@keyframes pl{0%{r:10;opacity:.5}70%{r:20;opacity:0}100%{r:20;opacity:0}}
.day{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:15px}
.day .nm{width:52px;color:#8A87A0;font-weight:600}
.day button{width:32px;height:32px;border:2px solid #ECE9F5;border-radius:10px;background:#fff;cursor:pointer;font-size:18px;line-height:1;color:#3D3A50;transition:all .15s}
.day button:hover{border-color:#4A90D9;color:#4A90D9}
.day .val{width:56px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.score{font-size:14px;color:#8A87A0;margin-top:14px;font-variant-numeric:tabular-nums}
.chartbox{margin-top:14px;background:linear-gradient(180deg,#FBFAFF,#fff);border:2px dashed #ECE9F5;border-radius:16px;padding:12px}
footer{text-align:center;color:#8A87A0;font-size:12px;margin-top:24px}
svg text{font-family:inherit}
@media(max-width:560px){h1{font-size:21px}.card{padding:18px}}
</style>
</head>
<body>
<span class="floaty" style="width:14px;height:14px;background:#4A90D9;top:12%;left:8%"></span>
<span class="floaty" style="width:10px;height:10px;background:#E86A92;top:24%;right:10%;animation-delay:1s"></span>
<span class="floaty" style="width:12px;height:12px;background:#F5A623;bottom:18%;left:12%;animation-delay:2s"></span>
<span class="floaty" style="width:9px;height:9px;background:#9B7EDE;bottom:26%;right:14%;animation-delay:.5s"></span>
<span class="floaty" style="width:11px;height:11px;background:#58B368;top:55%;left:4%;animation-delay:1.5s"></span>

<div class="wrap">
<header>
  <div>
    <span class="mascot"><svg viewBox="0 0 130 64" width="116" height="58">
      <path d="M8 46 L34 18 L58 36 L86 10 L110 26" fill="none" stroke="#4A90D9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="8" cy="46" r="6" fill="#E86A92"/><circle cx="34" cy="18" r="6" fill="#F5A623"/>
      <circle cx="58" cy="36" r="8" fill="#58B368"/><circle cx="86" cy="10" r="6" fill="#9B7EDE"/>
      <circle cx="110" cy="26" r="6" fill="#E86A92"/>
      <circle cx="55" cy="34" r="1.6" fill="#fff"/><circle cx="61" cy="34" r="1.6" fill="#fff"/>
      <path d="M54 39 q4 4 8 0" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    </svg></span>
    <h1 style="display:inline">折線圖<span class="hl">大冒險</span></h1>
  </div>
  <p>六年級數學互動課件 · 四關挑戰，全部破關就是讀圖小達人！</p>
</header>

<aside aria-label="得分與闖關進度" style="position:sticky;top:0;z-index:5;background:#fff8e8;border:2px solid #F5D99C;border-radius:16px;padding:12px 18px;margin-bottom:16px;font-variant-numeric:tabular-nums">
  <strong id="adventureScore" style="display:block;font-size:22px;color:#675397">已過關：0 / 4</strong>
  <div id="adventureProgress">目前第 1 / 4 關 · 尚餘 4 關；全部過關即完成。</div>
  <div id="quizScore">第二關測驗得分：0 / 3（滿 2 分過關）</div>
  <progress id="adventureMeter" max="4" value="0" aria-label="已過關數" style="width:100%;accent-color:#9B7EDE"></progress>
</aside>
<div class="tabs" id="tabs"></div>
<div class="card" id="body"></div>

<footer>建議用法：投影全班一起操作，或學生一人一機個別練習 · 卡關時可以多觀察折線的高低與走向</footer>
</div>

<script>
(function(){
var body=document.getElementById('body'),tabs=document.getElementById('tabs');
var done=[false,false,false,false],cur=0;

var C={blue:'#4A90D9',red:'#E86A92',green:'#58B368',purple:'#9B7EDE',orange:'#F5A623',ink:'#3D3A50'};

/* cartoon svg snippets */
var toonThermo='<svg viewBox="0 0 80 104" width="58"><rect x="31" y="6" width="18" height="56" rx="9" fill="#fff" stroke="#E86A92" stroke-width="3"/><rect x="36.5" y="26" width="7" height="30" rx="3" fill="#E86A92"/><circle cx="40" cy="76" r="19" fill="#E86A92"/><circle cx="33.5" cy="73" r="2.6" fill="#fff"/><circle cx="46.5" cy="73" r="2.6" fill="#fff"/><path d="M33 82 q7 6 14 0" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round"/><circle cx="27.5" cy="80" r="3.4" fill="#FFB3C6"/><circle cx="52.5" cy="80" r="3.4" fill="#FFB3C6"/></svg>';
var toonPanda='<svg viewBox="0 0 104 92" width="66"><circle cx="27" cy="17" r="13" fill="#3D3A50"/><circle cx="77" cy="17" r="13" fill="#3D3A50"/><ellipse cx="52" cy="50" rx="36" ry="31" fill="#fff" stroke="#ECE9F5" stroke-width="2"/><ellipse cx="39" cy="45" rx="8.5" ry="10.5" fill="#3D3A50" transform="rotate(-14 39 45)"/><ellipse cx="65" cy="45" rx="8.5" ry="10.5" fill="#3D3A50" transform="rotate(14 65 45)"/><circle cx="41" cy="43" r="3" fill="#fff"/><circle cx="63" cy="43" r="3" fill="#fff"/><ellipse cx="52" cy="56" rx="4.5" ry="3.2" fill="#3D3A50"/><path d="M45 62 q7 6 14 0" stroke="#3D3A50" stroke-width="2.2" fill="none" stroke-linecap="round"/><circle cx="31" cy="57" r="4" fill="#FFD9E2"/><circle cx="73" cy="57" r="4" fill="#FFD9E2"/></svg>';
var toonBook='<svg viewBox="0 0 104 84" width="66"><path d="M12 16 Q32 6 52 16 Q72 6 92 16 L92 60 Q72 50 52 60 Q32 50 12 60 Z" fill="#58B368"/><path d="M17 21 Q33 13 49 21 L49 54 Q33 46 17 54 Z" fill="#fff"/><path d="M55 21 Q71 13 87 21 L87 54 Q71 46 55 54 Z" fill="#fff"/><circle cx="65" cy="33" r="2.2" fill="#3D3A50"/><circle cx="77" cy="33" r="2.2" fill="#3D3A50"/><path d="M64 41 q6 5 13 0" stroke="#3D3A50" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="59" cy="39" r="3" fill="#FFD9E2"/><circle cx="83" cy="39" r="3" fill="#FFD9E2"/></svg>';
var toonSun='<svg viewBox="0 0 110 96" width="72"><g stroke="#F5A623" stroke-width="5" stroke-linecap="round"><line x1="55" y1="6" x2="55" y2="18"/><line x1="20" y1="20" x2="29" y2="29"/><line x1="90" y1="20" x2="81" y2="29"/><line x1="10" y1="52" x2="22" y2="52"/><line x1="100" y1="52" x2="88" y2="52"/></g><circle cx="55" cy="52" r="26" fill="#F5A623"/><circle cx="46" cy="48" r="2.8" fill="#fff"/><circle cx="64" cy="48" r="2.8" fill="#fff"/><path d="M45 57 q10 8 20 0" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round"/><circle cx="38" cy="56" r="4" fill="#FFCF8A"/><circle cx="72" cy="56" r="4" fill="#FFCF8A"/><ellipse cx="92" cy="76" rx="17" ry="11" fill="#fff" stroke="#C9D6EE" stroke-width="2"/><ellipse cx="81" cy="72" rx="9" ry="7" fill="#fff" stroke="#C9D6EE" stroke-width="2"/><circle cx="89" cy="75" r="1.6" fill="#3D3A50"/><circle cx="97" cy="75" r="1.6" fill="#3D3A50"/><path d="M89 80 q4 3 8 0" stroke="#3D3A50" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>';

/* ---------- chart ---------- */
function chartSVG(o){
  var W=660,H=o.h||320,mL=56,mR=20,mT=o.title?46:32,mB=46,pw=W-mL-mR,ph=H-mT-mB;
  var n=o.labels.length,stepX=pw/(n-1),yMax=o.yMax;
  var s='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block">';
  if(o.title)s+='<text x="'+(W/2)+'" y="24" text-anchor="middle" font-size="17" font-weight="700" fill="#3D3A50">'+o.title+'</text>';
  for(var v=0;v<=yMax;v+=o.yStep){
    var y=mT+ph-(v/yMax)*ph;
    s+='<line x1="'+mL+'" y1="'+y+'" x2="'+(W-mR)+'" y2="'+y+'" stroke="#ECE9F5" stroke-width="1"/>';
    s+='<text x="'+(mL-8)+'" y="'+(y+4)+'" text-anchor="end" font-size="12" fill="#8A87A0">'+v+'</text>';
  }
  for(var i=0;i<n;i++){
    var x=mL+i*stepX;
    s+='<text x="'+x+'" y="'+(H-mB+22)+'" text-anchor="middle" font-size="12" fill="#8A87A0">'+o.labels[i]+'</text>';
  }
  s+='<line x1="'+mL+'" y1="'+(mT+ph)+'" x2="'+(W-mR)+'" y2="'+(mT+ph)+'" stroke="#C9C4DC" stroke-width="1.5"/>';
  if(o.ylabel)s+='<text x="'+(mL-40)+'" y="'+(mT-12)+'" font-size="12" fill="#8A87A0">'+o.ylabel+'</text>';
  var pts=o.vals.map(function(v,i){return [mL+i*stepX,mT+ph-(v/yMax)*ph];});
  var d='M'+pts.map(function(p){return p[0].toFixed(1)+' '+p[1].toFixed(1);}).join(' L');
  if(o.showLine!==false)s+='<path id="'+(o.pid||'lcp')+'" d="'+d+'" fill="none" stroke="'+o.color+'" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>';
  pts.forEach(function(p,i){
    s+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="5" fill="'+o.color+'" stroke="#fff" stroke-width="2">'+(o.dots?'<title>'+o.labels[i]+'：'+o.vals[i]+(o.unit||'')+'</title>':'')+'</circle>';
  });
  s+='</svg>';
  return {html:s,pts:pts};
}
function animateLine(pid,dur){
  var p=document.getElementById(pid);if(!p)return;
  var len=p.getTotalLength();
  p.style.strokeDasharray=len;p.style.strokeDashoffset=len;
  p.getBoundingClientRect();
  p.style.transition='stroke-dashoffset '+dur+'ms ease';
  p.style.strokeDashOffset=len;p.style.strokeDashoffset='0';
}

/* ---------- step 1 ---------- */
var s1done=[false,false,false];
var s1q=[{x:330,y:44,correct:'標題',exp:'對！標題告訴我們這張圖在記錄什麼事情。'},
 {x:24,y:188,correct:'縱軸',exp:'沒錯！縱軸（直直的軸）標示數值大小，這裡是體溫。'},
 {x:492,y:114,correct:'數據點',exp:'答對了！圓圓的數據點記錄每天量到的體溫，折線把它們依序連起來。'}];
function renderS1(){
  var c=chartSVG({title:'小華一週體溫紀錄（°C）',labels:['一','二','三','四','五','六','日'],vals:[36.5,37.2,38.0,37.5,36.8,36.6,36.5],yMax:40,yStep:5,unit:'°C',color:C.red,dots:true});
  var hot='';
  s1q.forEach(function(q,i){
    hot+='<g class="hot" data-i="'+i+'"><circle class="pulse" cx="'+q.x+'" cy="'+q.y+'" r="10" fill="none" stroke="#F5A623" stroke-width="2"/><circle cx="'+q.x+'" cy="'+q.y+'" r="11" fill="#3D3A50"/><text x="'+q.x+'" y="'+(q.y+4.5)+'" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">'+(i+1)+'</text></g>';
  });
  var svg=c.html.replace('</svg>',hot+'</svg>');
  body.innerHTML='<div class="stephead">'+toonThermo+'<div><h3>第一關：折線圖長什麼樣子？</h3>'
   +'<p>小華感冒了，媽媽記錄了他一週的體溫。<b>按下按鈕</b>看看折線怎麼畫出來，再點點圖上閃爍的 <b>1、2、3</b>，說說它們是什麼。</p></div></div>'
   +'<div class="row"><button class="btn btn-p" id="lcPlay">▶ 畫出折線</button><button class="btn btn-g" id="lcReset">重畫</button></div>'
   +'<div class="chartbox" id="lcChart">'+svg+'</div>'
   +'<div class="msg info" id="lcMsg">折線圖：用<b>點</b>記錄數據，再用<b>線</b>把點依順序連起來的統計圖。</div>';
  document.getElementById('lcPlay').onclick=function(){animateLine('lcp',1800);};
  document.getElementById('lcReset').onclick=function(){var p=document.getElementById('lcp');var len=p.getTotalLength();p.style.transition='none';p.style.strokeDasharray=len;p.style.strokeDashoffset=len;};
  document.querySelectorAll('.hot').forEach(function(g){
    g.addEventListener('click',function(){
      var i=+g.dataset.i;
      if(s1done[i])return;
      var opts=['標題','縱軸','數據點','折線'];
      var msg=document.getElementById('lcMsg');
      msg.className='msg info';msg.innerHTML='你點到了 <b>'+(i+1)+'</b> 號位置。請問這是折線圖的哪個部分？'
        +'<div id="lcOpts">'+opts.map(function(o){return '<button class="opt" data-v="'+o+'">'+o+'</button>';}).join('')+'</div>';
      document.querySelectorAll('#lcOpts .opt').forEach(function(b){
        b.onclick=function(){
          if(b.dataset.v===s1q[i].correct){
            s1done[i]=true;b.classList.add('right');
            g.style.opacity='0.3';g.style.pointerEvents='none';
            msg.className='msg ok';msg.textContent=s1q[i].exp;
            if(s1done.every(Boolean)){msg.textContent='太棒了！標題、縱軸、數據點都找到了。前往下一關讀圖去！';markDone(0);}
          }else{
            b.classList.add('wrong');msg.className='msg no';msg.textContent='再想想看～提示：看看它的位置和旁邊的文字。';
          }
        };
      });
    });
  });
}

/* ---------- step 2 ---------- */
var s2data=[120,150,90,200,180,240,160];
var s2qs=[
 {q:'哪一天遊客人數最多？',opts:['星期四','星期六','星期日'],a:1,exp:'星期六有 240 人，是最高點。讀折線圖時，先找最高的那個點！'},
 {q:'星期二的遊客人數是多少？',opts:['120 人','150 人','90 人'],a:1,exp:'找到「二」的正上方，對到縱軸，是 150 人。'},
 {q:'從星期二到星期三，人數怎麼變化？',opts:['增加 60 人','減少 60 人','沒有變化'],a:1,exp:'150 → 90，線往下走，表示減少 150−90=60 人。線往上＝變多，線往下＝變少。'}];
var s2idx=0,s2score=0,s2lock=false,s2run=0;
function renderS2(){
  s2run++;
  s2idx=0;s2score=0;
  var c=chartSVG({title:'動物園一週遊客人數',labels:['一','二','三','四','五','六','日'],vals:s2data,yMax:280,yStep:40,unit:'人',color:C.blue,dots:true,ylabel:'人數'});
  body.innerHTML='<div class="stephead">'+toonPanda+'<div><h3>第二關：讀圖小達人</h3>'
   +'<p>觀察折線的<b>高低</b>和<b>走向</b>，回答三個問題，滿 2 分就過關！</p></div></div>'
   +'<div class="chartbox" id="lcChart">'+c.html+'</div>'
   +'<div id="lcQuiz"></div><div class="score" id="lcScore"></div>';
  askS2();
}
function askS2(){
  s2lock=false;
  var run=s2run;
  var q=s2qs[s2idx];
  document.getElementById('lcQuiz').innerHTML='<div class="msg info"><b>問題 '+(s2idx+1)+'/3：</b>'+q.q
   +'<div id="lcOpts">'+q.opts.map(function(o,i){return '<button class="opt" data-i="'+i+'">'+o+'</button>';}).join('')+'</div><div id="lcFb"></div></div>';
  document.getElementById('lcScore').textContent='目前得分：'+s2score+' / '+s2qs.length;
  updateAdventureScore();
  document.querySelectorAll('#lcOpts .opt').forEach(function(b){
    b.onclick=function(){
      if(s2lock)return;s2lock=true;
      var i=+b.dataset.i,fb=document.getElementById('lcFb');
      if(i===q.a){b.classList.add('right');s2score++;fb.className='msg ok';fb.textContent='答對了！'+q.exp;}
      else{b.classList.add('wrong');document.querySelectorAll('#lcOpts .opt')[q.a].classList.add('right');fb.className='msg no';fb.textContent='正確答案是「'+q.opts[q.a]+'」。'+q.exp;}
      s2idx++;
      document.getElementById('lcScore').textContent='目前得分：'+s2score+' / '+s2qs.length;
      updateAdventureScore();
      setTimeout(function(){
        if(cur!==1||run!==s2run)return;
        if(s2idx<3)askS2();
        else{
          document.getElementById('lcQuiz').innerHTML='<div class="msg '+(s2score>=2?'ok':'no')+'">測驗結束！你得到 '+s2score+' / 3 分。'+(s2score===3?'完美！你就是讀圖小達人！':s2score>=2?'不錯喔，再複習一下變化量就更厲害了！':'別灰心，回到圖上多觀察幾次吧！')+'</div>';
          document.getElementById('lcScore').textContent='最終得分：'+s2score+' / 3';
          if(s2score>=2)markDone(1);
        }
      },2200);
    };
  });
}

/* ---------- step 3 ---------- */
var s3target=[100,140,120,180,220,260,200],s3user=[0,0,0,0,0,0,0],s3drawn=false;
var s3labels=['一','二','三','四','五','六','日'];
function renderS3(){
  s3user=[0,0,0,0,0,0,0];s3drawn=false;
  body.innerHTML='<div class="stephead">'+toonBook+'<div><h3>第三關：動手畫折線圖</h3>'
   +'<p>書店每日來客數目標：<b>100、140、120、180、220、260、200 人</b>。用 + / − 設好每天的值，再按「連成折線」檢查！</p></div></div>'
   +'<div id="lcEditor"></div>'
   +'<div class="row"><button class="btn btn-p" id="lcDraw">連成折線！</button><button class="btn btn-g" id="lcClear">全部歸零</button></div>'
   +'<div class="chartbox" id="lcChart"></div>'
   +'<div class="msg info" id="lcMsg">小提示：先想好每天的數字，再依序調整喔。</div>';
  document.getElementById('lcDraw').onclick=drawS3;
  document.getElementById('lcClear').onclick=function(){s3user=[0,0,0,0,0,0,0];updS3Editor();updS3Chart(false);};
  updS3Editor();updS3Chart(false);
}
function updS3Editor(){
  document.getElementById('lcEditor').innerHTML=s3labels.map(function(l,i){
    return '<div class="day"><span class="nm">星期'+l+'</span><button data-i="'+i+'" data-d="-1">−</button><span class="val">'+s3user[i]+'</span><button data-i="'+i+'" data-d="1">＋</button></div>';
  }).join('');
  document.querySelectorAll('#lcEditor button').forEach(function(b){
    b.onclick=function(){
      var i=+b.dataset.i;
      s3user[i]=Math.max(0,Math.min(300,s3user[i]+(+b.dataset.d)*10));
      updS3Chart(s3drawn);updS3Editor();
    };
  });
}
function updS3Chart(anim){
  var c=chartSVG({title:'書店每日來客數（人）',labels:s3labels.map(function(l){return '週'+l;}),vals:s3user,yMax:300,yStep:50,unit:'人',color:C.green,pid:'lcu',ylabel:'人數'});
  document.getElementById('lcChart').innerHTML=c.html;
  if(anim)animateLine('lcu',700);
}
function drawS3(){
  s3drawn=true;updS3Chart(true);
  var hit=0;
  s3target.forEach(function(t,i){if(s3user[i]===t)hit++;});
  var msg=document.getElementById('lcMsg');
  if(hit===7){msg.className='msg ok';msg.textContent='完美！七個點全部正確，這是一張超棒的折線圖！';markDone(2);}
  else{
    var wrong=s3target.map(function(t,i){return s3user[i]===t?null:i;}).filter(function(x){return x!==null;});
    msg.className='msg no';msg.textContent='有 '+hit+' 個點正確。再檢查一下星期'+s3labels[wrong[0]]+'的位置，調整後再連一次！';
  }
}

/* ---------- step 4 ---------- */
var s4picked=false;
function renderS4(){
  s4picked=false;
  var base=[20,22,23,25,26,28];
  var c=chartSVG({title:'某城市一週氣溫紀錄（°C）',labels:['一','二','三','四','五','六','下'],vals:base.concat([28]),yMax:36,yStep:6,unit:'°C',color:C.orange,dots:true,pid:'lcb',showLine:false,ylabel:'氣溫'});
  body.innerHTML='<div class="stephead">'+toonSun+'<div><h3>第四關：小挑戰——預測未來</h3>'
   +'<p>整條線一路上升！如果你是氣象小主播，你覺得<b>下週一</b>的氣溫比較可能是多少？先說理由再選答案！</p></div></div>'
   +'<div class="row"><button class="btn btn-p" id="lcPlay">▶ 看看這一週的走勢</button></div>'
   +'<div class="chartbox" id="lcChart">'+c.html+'</div>'
   +'<div id="lcOpts">'
   +['12°C：突然變冷','28°C：維持趨勢','40°C：急速飆高'].map(function(o,i){return '<button class="opt" data-i="'+i+'">'+o+'</button>';}).join('')
   +'</div><div class="msg info" id="lcMsg">提示：折線的「走向」透露了數據的趨勢。</div>';
  var svg=document.querySelector('#lcChart svg');
  var circs=svg.querySelectorAll('circle');
  var lastC=circs[circs.length-1];
  lastC.style.opacity='0';lastC.style.transition='opacity .3s ease';
  var p6=c.pts[5],p7=c.pts[6];
  var ext=document.createElementNS('http://www.w3.org/2000/svg','path');
  ext.setAttribute('d','M'+p6[0].toFixed(1)+' '+p6[1].toFixed(1)+' L'+p7[0].toFixed(1)+' '+p7[1].toFixed(1));
  ext.setAttribute('fill','none');ext.setAttribute('stroke',C.red);
  ext.setAttribute('stroke-width','3');ext.setAttribute('stroke-linecap','round');
  ext.style.strokeDasharray='1';ext.style.strokeDashoffset='1';
  svg.insertBefore(ext,lastC);
  document.getElementById('lcPlay').onclick=function(){animateLine('lcb',1400);};
  document.querySelectorAll('#lcOpts .opt').forEach(function(b){
    b.onclick=function(){
      if(s4picked)return;
      var i=+b.dataset.i,msg=document.getElementById('lcMsg');
      if(i===1){
        s4picked=true;
        b.classList.add('right');msg.className='msg ok';
        msg.innerHTML='答對了！折線一路上升，數據呈現上升的<b>趨勢</b>，最合理的預測是延續趨勢。（也要記得：預測只是推測，實際天氣還是有可能變化喔！）';
        var len=ext.getTotalLength();
        ext.style.strokeDasharray=len;ext.style.strokeDashoffset=len;ext.getBoundingClientRect();
        ext.style.transition='stroke-dashoffset 900ms ease';ext.style.strokeDashoffset='0';
        lastC.setAttribute('fill',C.red);
        lastC.style.opacity='1';
        setTimeout(function(){markDone(3);},900);
      }else{
        b.classList.add('wrong');msg.className='msg no';msg.textContent='從現有的折線看不出「突然變冷」或「急速飆高」的跡象喔。觀察線的走向，再試一次！';
      }
    };
  });
}

/* ---------- nav ---------- */
var names=[['① 認識折線圖',C.red],['② 讀圖小達人',C.blue],['③ 動手畫一畫',C.green],['④ 趨勢小挑戰',C.orange]];
var renders=[renderS1,renderS2,renderS3,renderS4];
function markDone(i){if(!done[i]){done[i]=true;renderTabs();}}
function updateAdventureScore(){
  var completed=done.filter(Boolean).length;
  document.getElementById('adventureScore').textContent='已過關：'+completed+' / '+done.length;
  document.getElementById('adventureProgress').textContent=completed===done.length?'全部過關，冒險完成！':'目前第 '+(cur+1)+' / '+done.length+' 關 · 尚餘 '+(done.length-completed)+' 關；全部過關即完成。';
  document.getElementById('quizScore').textContent='第二關測驗得分：'+(s2score||0)+' / '+s2qs.length+'（滿 2 分過關）';
  document.getElementById('adventureMeter').value=completed;
}
function renderTabs(){
  updateAdventureScore();
  tabs.innerHTML=names.map(function(n,i){
    return '<button class="tab'+(i===cur?' on':'')+(done[i]?' done':'')+'" data-i="'+i+'"><span class="dot" style="background:'+n[1]+'"></span>'+n[0]+'</button>';
  }).join('');
  tabs.querySelectorAll('.tab').forEach(function(b){
    b.onclick=function(){cur=+b.dataset.i;renderTabs();renders[cur]();};
  });
}
renderTabs();renderS1();
})();
</script>
</body>
</html>
