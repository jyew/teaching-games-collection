<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>加法星星站 · P1 數學</title>
  <link rel="stylesheet" href="../assets/math-games.css">
  <script src="../assets/math-games.js" defer></script>
</head>
<body data-grade="p1">
  <main>
    <a href="../index.html">← 返回遊戲館</a>
    <aside class="scoreboard" aria-label="得分與回合進度">
      <strong id="current-score">得分：0 / 10</strong>
      <p id="round-progress">已完成 0 / 10 題 · 尚餘 10 題</p>
      <progress id="score-meter" max="10" value="0" aria-label="回合完成進度"></progress>
    </aside>
    <header><p id="concept">P1 · 20 以內的加法</p><h1 id="title">加法星星站</h1></header>
    <p class="tip" id="tip">把兩組星星合起來，數一數共有多少顆。</p>
    <p>每回合 10 題，不限時。選出答案後，一起看看解說！</p>
    <noscript><p>請啟用 JavaScript 來玩這個互動遊戲。</p></noscript>
    <p id="loading">遊戲載入中；若未能開始，請重新整理並檢查遊戲檔案是否齊全。</p>
    <section class="panel" id="play" aria-label="數學挑戰" hidden>
      <p id="progress"></p><progress id="meter" max="10" value="0" aria-label="已完成題數"></progress>
      <h2 id="prompt" tabindex="-1"></h2>
      <div class="visual" id="visual"></div>
      <div class="answers" id="answers" role="group" aria-labelledby="prompt"></div>
      <p id="feedback" role="status" aria-live="polite" aria-atomic="true"></p>
      <button class="primary" id="next" type="button" hidden>下一題</button>
    </section>
    <section class="panel" id="summary" aria-label="挑戰成績" hidden>
      <h2 id="result" tabindex="-1"></h2><p id="encouragement"></p>
      <button class="primary" id="restart" type="button">再玩一次</button>
    </section>
  </main>
</body>
</html>
